# Scene capture works because we ship reproduce_state.py — `scene.create`
# snapshots the color's full canonical state (kind + xy + kelvin +
# brightness), and `scene.apply` (or selecting the scene) restores it.
#
# This is how you preserve "the way the room looked at 7pm" including the
# saved color, not just the light states.

# 1) Capture the current state as a scene at runtime:
script:
  capture_current_scene:
    alias: Capture "Living room — now" scene
    sequence:
      - service: scene.create
        data:
          scene_id: living_room_now
          snapshot_entities:
            - color.living_room_color
            - light.living_room_lamp
            - light.living_room_strip

# 2) Restore later with a normal scene.apply call:
automation:
  - alias: Restore living room at 7pm
    description: At 19:00, apply the captured "now" scene including color state.
    trigger:
      - platform: time
        at: "19:00:00"
    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_now
