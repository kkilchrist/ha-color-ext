set_color:
  target:
    entity:
      integration: color
      domain: color
  fields:
    hex_value:
      example: "#FF8000"
      selector:
        text:
    rgb_color:
      example: "[255, 128, 0]"
      selector:
        color_rgb:
    hs_color:
      example: "[30, 100]"
      selector:
        object:
    xy_color:
      example: "[0.5, 0.4]"
      selector:
        object:
    color_temp_kelvin:
      example: 4000
      selector:
        color_temp:
          unit: kelvin
          min: 1000
          max: 20000
    color_name:
      example: crimson
      selector:
        text:
    brightness:
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider

set_brightness:
  target:
    entity:
      integration: color
      domain: color
  fields:
    brightness:
      required: true
      example: 180
      selector:
        number:
          min: 0
          max: 255
          mode: slider

clear_brightness:
  target:
    entity:
      integration: color
      domain: color

apply_to:
  name: Apply to lights
  description: >
    Send the stored color to one or more light entities. Uses xy_color for
    chromatic colors and color_temp_kelvin for whites; Home Assistant's light
    integration converts to the target's supported_color_modes automatically.
  target:
    entity:
      integration: color
      domain: color
  fields:
    lights:
      name: Target lights
      description: "Light entities to apply the color to."
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    override_brightness:
      name: Override brightness (use stored value)
      description: >
        If true AND a brightness is stored on this color, include the
        stored brightness in the light.turn_on call. Ignored when the
        `brightness` field below is set explicitly.
      default: false
      selector:
        boolean:
    brightness:
      name: Brightness (explicit)
      description: >
        Optional per-call brightness 0-255. When set, wins over
        override_brightness. Useful when scripts want this color with a
        specific brightness without touching the stored value.
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider
